spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:supersecretkey_minimum32chars_for_hs256_algo}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

dummy-login:
  admin-id: 00000000-0000-0000-0000-000000000001
  user-id:  00000000-0000-0000-0000-000000000002

slots:
  generation-window-days: 30
