services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-booking_db}
      POSTGRES_USER:     ${DB_USER:-booking_user}
      POSTGRES_PASSWORD: ${DB_PASS:-booking_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booking_user} -d ${DB_NAME:-booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-booking_db}
      DB_USER: ${DB_USER:-booking_user}
      DB_PASS: ${DB_PASS:-booking_secret}

      JWT_SECRET:        ${JWT_SECRET:-local-dev-secret-key-change-in-production-32chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      SLOTS_GENERATION_WINDOW_DAYS: ${SLOTS_GENERATION_WINDOW_DAYS:-30}

      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/_info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data: